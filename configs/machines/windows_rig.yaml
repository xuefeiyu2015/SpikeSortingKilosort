# Lab Windows rig: CUDA GPU, SpikeGLX command line tools, network data share.
#
# System facts only: scratch disk, installed tools, device. Where recordings
# live is a property of the recording, so it belongs in the session config --
# do not re-add data_root / output_root here.

# Fast local SSD for Kilosort's temp.dat. Must be a local drive, never the
# network share (Z:) that the session configs read their data from.
cache_dir: "D:/kilosort_cache"

# Folders containing runit.bat / TPrime.exe
catgt_dir: "C:/SpikeGLX/CommandLineTools/CatGTWinApp/CatGT-win"
tprime_dir: "C:/SpikeGLX/CommandLineTools/TPrimeWinApp"

# Conda envs are created here by the admin account with `conda create -p ...`, so
# they are shared by every user but are not registered in a lab account's own
# `conda env list`. scripts/check_env.py looks here as well as asking conda.
conda_envs_dir: "C:/ProgramData/anaconda3/envs"

device: "cuda"
