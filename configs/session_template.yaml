# Template for a real recording session. Copy to configs/<session>.yaml and edit.
# Copies are gitignored; this template is tracked.
#
#   python run_sorting_pipeline.py --config configs/Athos_2026_08_13.yaml \
#          --machine windows_rig
#
# Data paths live here, never in the machine profile: configs/machines/<machine>.yaml
# carries only system facts (scratch disk, tool locations, device).
#
# A placeholder that names nothing raises on load rather than resolving to "" --
# so a typo, or a {data_root} left over from the old two-layer config, fails
# immediately instead of quietly producing "/Monkey Athos/...".

monkey: "Monkey Athos"
session: "2026-08-13"

# Roots stop at the share. Each system's directory is built as
# <root>/<monkey>/<session> and exposed as {blackrock_dir} / {neuropixels_dir}.
# The two are separate because the systems are recorded by different machines and
# need not land on the same share -- point them at the same place when they do.
#
# For a recording that predates this convention, skip roots entirely and state
# `blackrock_dir:` / `neuropixels_dir:` outright.
roots:
  blackrock: "Z:/jeurissenlab.cns.nyu.edu/server"
  neuropixels: "Z:/jeurissenlab.cns.nyu.edu/server"

# {monkey}, {session}, {cache} and {downloads} are always available, and may be
# used inside a root.

# Whether a system recorded is *derived* from whether its block below declares
# paths. To say a system did not record, remove its block -- there is no flag, and
# nothing to keep in step with the paths. Cross-system alignment (steps 8-9)
# likewise runs when both blocks are present.
#
# Declaring paths means the data is *expected*, not that it is present: a share
# that is not mounted still fails loudly with "does not exist" rather than being
# read as "this system never recorded".
#
# The one question paths cannot answer is whether to sort. False here with the
# block still present is the "extract the LFP and the sync pulses, but do not
# sort" case.
kilosort_on_neuropixels: true
kilosort_on_blackrock: true

# Outputs sit beside the recording that produced them:
#
#   {blackrock_dir}/blackrock/kilosort4/    sorted Utah array
#   {blackrock_dir}/sync/                   NSP edge files
#   {blackrock_dir}/aligned/, figures/      cross-system, on the reference timebase
#   {neuropixels_dir}/neuropixels/kilosort4/  sorted Neuropixels
#   {neuropixels_dir}/sync/, lfp/           SpikeGLX edge files, per-channel LFP

blackrock:

  # HUB-*.ns6 carries the Utah array spike data.
  spike_file: "{blackrock_dir}/HUB-Athos_001.ns6"
  # NSP-*.ns5 carries the two sync channels (see SynchronizePulse_setup.md):
  #   channel 1 = 1 Hz square wave from SpikeGLX SMA1
  #   channel 2 = 14 s coded burst from Blackrock DO1
  sync_file: "{blackrock_dir}/NSP-Athos_001.ns5"
  sync_1hz_channel: 1
  burst_channel: 2
  # Thresholds in the units returned by the reader (volts after neo scaling).
  sync_threshold: 2.5
  burst_threshold: 2.5
  # A .nsX may expose several streams; pin one if read_blackrock is ambiguous.
  stream_id: null
  # Merged over the shared `kilosort:` block at the end of this file. A dead
  # electrode goes here: Kilosort removes what you list, but cannot find them.
  # Entries are recording channel numbers -- rows in the binary, matched against
  # the probe's chanMap -- not positions on the array.
  #
  # Non-neural channels sharing the .ns6 (sync, analog in) need no entry: the
  # probe drops whatever its chanMap does not cover.
  kilosort:
    bad_channels: []
    # No drift correction on a 400 um grid. Kilosort corrects drift by
    # interpolating between neighbouring contacts with a Gaussian kernel of
    # sig_interp = 20 um; at 400 um the weight to the nearest neighbour is ~1e-87,
    # so there is nothing to interpolate from. A nonzero shift estimate would then
    # scale the data toward zero rather than moving it -- the correction can only
    # subtract signal here. Drift on a chronic array is real; this is not the tool
    # for it.
    nblocks: 0
  # The array's channel map. Which array is in which monkey is a property of the
  # session, so it is named here rather than passed as a flag.
  #   probe_file  a JSON built once by make_probe.py and kept in configs/probes/
  #   cmp_file    the array's own .cmp, parsed when no probe_file is given
  # With neither, sorting falls back to a PLACEHOLDER 10x10 grid in channel order
  # and check_env.py warns: units would land on the wrong electrodes.
  probe_file: "configs/probes/utah_athos_A.json"
  cmp_file: null

neuropixels:
  # SpikeGLX run: <run_dir>/<run_name>_g<gate>/...
  run_dir: "{neuropixels_dir}"
  run_name: "Athos_2026_08_13"
  gate: 0
  trigger: 0
  probes: [0]
  # Channel map. The run's own .meta wins where it has ~snsGeomMap -- it records
  # which sites were actually active for this recording, which no external file
  # can know. probe_file is the fallback for a run with no usable .meta; with
  # neither, setup_probe raises rather than guess a layout. Leave null for NP 1.0
  # NHP long: the .meta is authoritative per run.
  probe_file: null
  n_chan_bin: null
  # SY-word bit carrying the SMA1 1 Hz square wave (SpikeGLX default is 6).
  sync_bit: 6
  sync_pulse_ms: 500
  # XA1 analog input in the obx stream carries the 14 s coded burst.
  burst_word: 1
  # CatGT -xa thresholds in volts, (primary, secondary); set from a real obx file.
  burst_threshold_v: [1.0, 0.0]
  # Expected burst pulse width in ms; 0 accepts any width.
  burst_pulse_ms: 0
  # Merged over the shared `kilosort:` block at the end of this file. Same keys as
  # the blackrock one -- a dead site is named the same way on either system.
  kilosort:
    bad_channels: []
    # Drift correction. 1 is rigid: the whole shank is assumed to move together.
    # Raise it for a long session where the tip and the surface drift differently
    # (nblocks: 5 gives 5 non-overlapping blocks plus 4 straddling the boundaries).
    # 0 disables it.
    nblocks: 1

sync_period_s: 1.0
burst_interval_s: 14.0
# Step 9 passes when burst residuals stay under this (seconds).
alignment_tolerance_s: 0.001

# Passed straight to Kilosort. A system's own `kilosort:` block above is merged
# over this one, key by key. Empty means Kilosort's defaults.
#
# There is no preprocessing outside Kilosort, because Kilosort already does it on
# every batch: it subtracts the median across channels when do_CAR is set, then
# highpasses at highpass_cutoff, whitens, and drift-corrects. The question is
# which of *those* to turn on, not what to do beforehand.
#
#   do_CAR                       true    subtract the median across channels
#                                        (the name says average; the code takes a
#                                        median, which is what a Utah array wants)
#   highpass_cutoff              300     Hz
#   nblocks                      1       drift correction blocks; 0 disables
#   whitening_range              32      channels used for local whitening
#   artifact_threshold           inf     zero out any batch exceeding this
#   bad_channels                 null    channels to exclude. Kilosort removes what
#                                        you list; it does not detect them, so look
#                                        at the data and name them per array
#   skip_kilosort_preprocessing  false   only if you filtered the data yourself
#
# Every other Kilosort parameter passes through unchanged.
#
# Settings that describe *how you want sorting done* belong here; settings that
# describe *the hardware* -- bad_channels, nblocks -- belong in the per-system
# blocks above, because the probe and the array need different answers.
kilosort: {}
