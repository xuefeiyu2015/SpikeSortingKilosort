# Lab Windows rig: CUDA GPU, SpikeGLX command line tools, network data share.
#
# System facts only: scratch disk, installed tools, device. Where recordings
# live is a property of the recording, so it belongs in the session config --
# do not re-add data_root / output_root here.

# Fast local SSD for Kilosort's temp.dat. Must be a local drive, never the
# network share (Z:) that the session configs read their data from.
cache_dir: "D:/kilosort_cache"

# Folders containing runit.bat / TPrime.exe. Both distributions nest the real
# tools one level below the *WinApp folder -- the executables live in CatGT-win
# and TPrime-win, not in the folder the zip unpacks to.
catgt_dir: "C:/SpikeGLX/CommandLineTools/CatGTWinApp/CatGT-win"
tprime_dir: "C:/SpikeGLX/CommandLineTools/TPrimeWinApp/TPrime-win"

# Conda envs are created here by the admin account with `conda create -p ...`, so
# they are shared by every user but are not registered in a lab account's own
# `conda env list`. This is the last resort of the three sources check_env.py
# tries: the env it is already running in, then conda, then this directory.
conda_envs_dir: "C:/ProgramData/anaconda3/envs"

# Environments on this box, by role. Omit the block to get the conventional names
# (sorting: kilosort4, curation: phy). Point `sorting` at another env to check or
# switch Kilosort versions; `--sorting-env` does it for one run.
#
# `name` is what the env is called. `path` is optional and is the directory that
# HOLDS the env, not the env itself -- the prefix is path/name. Given a path,
# that is the answer: nothing else is consulted, and a prefix that is not there
# is an error rather than an excuse to go looking for the name elsewhere.
#
#   sorting: kilosort4          # shorthand for {name: kilosort4}; search for it
#   sorting:
#     name: ks4
#     path: "D:/envs"           # -> D:/envs/ks4, used as given
conda_envs:
  sorting: kilosort4
  curation: phy

# This rig runs a CUDA 12.8 torch build. Recorded as a fact about the box, not as
# an install instruction -- torch comes in with kilosort, per Kilosort's own docs.
# `check_env.py` reports the build actually present and whether it sees the GPU.
device: "cuda"
