# Demo session -- an ordinary session config that happens to point at the
# official Kilosort4 example recording.
#
# Nothing about it is special-cased in the code. It has the same keys, and the
# same edit/defaults fences, as session_template_utah_probe.yaml, and differs only in where
# the data is and in three settings a bare .bin needs (n_chan_bin, sample_rate,
# probe_file) where a real SpikeGLX run reads all three from the .meta beside its
# bin_file.
#
# There is no `blackrock:` block, and that is the whole statement: no Blackrock
# data, so no Blackrock stage runs and there is nothing to align against.
#
# Set it up once with notebooks/setup_demo_data.ipynb, then:
#   python run_sorting_pipeline.py   --config configs/session_demo_1probe.yaml
#   python run_exporting_pipeline.py --config configs/session_demo_1probe.yaml

# What to do with it. The demo sorts, and exports what it sorted; there is no LF
# band beside a bare .bin to export, so that stays off. These keys are the only
# place those decisions live -- the flags on either driver override them for a
# single run and change nothing here.
kilosort_on_neuropixels: true
export_lfp: false
export_figures: true
export_groups: ["good", "mua"]

# Where the demo recording lives. Stated outright, like any other session --
# nothing is composed. notebooks/setup_demo_data.ipynb downloads to whatever this
# names, so change it here and the notebook follows.
neuropixels_dir: "Z:/Monkey neuropixel_demo/demo"

neuropixels:
  # ---------- edit for this session ----------
  # The download is a bare .bin: no .meta beside it, and its name is not
  # SpikeGLX's <run>_g0_t0.imec0.ap.bin, so there is no run to recover. CatGT
  # is skipped with that reason, and the channel count and rate are stated here
  # because there is no .meta to read them from.
  bin_file: "{neuropixels_dir}/ZFM-02370_mini.imec0.ap.short.bin"
  n_chan_bin: 385        # 384 AP channels + the SY word
  sample_rate: 30000
  # With no .meta there is no geometry to derive, so the map is named here. Built
  # once by notebooks/setup_demo_data.ipynb; a real run leaves this null and lets
  # setup_probe read ~snsGeomMap from the .meta instead.
  probe_file: "configs/probes/np1_default.json"

  # ---------- defaults: change only if you know what they mean ----------
  sync_bit: 6            # SY-word bit carrying the 1 Hz wave (SpikeGLX default)
  sync_pulse_ms: 500     # its high duration; a CatGT -xd argument

# The pulse train itself. Nothing reads these without a second system to align
# to, but they are what a real session states, so the demo states them too.
sync_period_s: 1.0
burst_interval_s: 14.0
alignment_tolerance_s: 0.001      # step 9 passes below this burst residual

# Passed straight to Kilosort. Empty means its defaults, which already highpass at
# 300 Hz and subtract the median across channels on every batch -- there is no
# preprocessing step outside Kilosort, and nothing to turn on here for a stock
# recording like this one.
kilosort: {}
