# Demo session -- an ordinary session config that happens to point at the
# official Kilosort4 example recording.
#
# Nothing about it is special-cased in the code: it names a binary and declares
# which systems recorded, which is what turns off the stages it has no data for.
#
# Fetch the file once (separate from the pipeline, not a pipeline stage):
#   python scripts/fetch_demo_data.py --dest ~/ephys/demo_data
# Then:
#   python run_sorting_pipeline.py --config configs/demo.yaml
session: demo

# No second system to align to, so steps 8-9 are skipped. Sync *extraction* still
# runs: this recording's SY word does carry the 1 Hz square wave.
skip_sync: true

# No NSP-*.ns5 / HUB-*.ns6, so step 4 and the Blackrock half of steps 8-10 skip.
has_blackrock_data: false

# This recording has no monkey/date structure to build a path from, so its
# directory is stated outright instead of coming from a root. Everything the
# demo produces lands beside the binary: neuropixels/kilosort4/, sync/, lfp/.
neuropixels_dir: "~/ephys/demo_data"

neuropixels:
  bin_file: "{neuropixels_dir}/ZFM-02370_mini.imec0.ap.short.bin"
  # This download is a bare .bin with no .meta beside it, so the channel count
  # and rate have to be stated here. 384 AP channels + 1 SY word.
  n_chan_bin: 385
  sample_rate: 30000
  probe_name: "NeuroPix1_default.mat"
  sync_bit: 6
  sync_pulse_ms: 500

# Kilosort filters and common-average-references internally, which is enough for a
# dense probe, so nothing extra is applied here. Stated rather than omitted so the
# setting is visible: apply: true would reroute the sort through SpikeInterface and
# cost a second copy of the recording in cache_dir.
preprocess:
  apply: false
  bandpass: [300, 6000]
  common_reference: "median"

kilosort_settings: {}
