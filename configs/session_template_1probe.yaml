# Template for a session whose spikes come from ONE Neuropixels probe, with
# Blackrock present only to carry the sync pulses. Copy and edit.
# Copies are gitignored; this template is tracked.
#
#   conda activate kilosort4
#   python run_sorting_pipeline.py --config <session>
#     <session> is this file's name, e.g. session_Porthos_1probe: no folder, no
#     .yaml. --machine defaults to the platform, so the rig needs none.
# curation in phy
#   conda activate phy
#   cd <neuropixels_dir>/kilosort4/      (the directory holding params.py)
#   phy template-gui params.py
# after curation -- back in kilosort4: the waveform export reads the recording
# through Kilosort's own preprocessing
#   conda activate kilosort4
#   python run_exporting_pipeline.py --config <session>
# A new session means editing five values: the two directories, the two Blackrock
# filenames, and the SpikeGLX bin_file. Each block puts what changes first and
# fences off what does not. Below a fence are the defaults -- change one only if
# you know what it means. The notes at the end explain every choice made here.
#
# Data paths live in this file, never in the machine profile:
# configs/machines/<machine>.yaml carries only facts about the box (scratch disk,
# tool locations, device).

# What to do with what was recorded. Which systems recorded is derived from
# whether their blocks below declare paths; these say what to do with them, and
# they are the only place that decision is written down -- see "What runs".
#
# false = extract that system's LFP and sync pulses, but do not sort it.
kilosort_on_neuropixels: true
# false here because this session records no Utah array: Blackrock is present
# to carry the sync pulses. The flag is a request, so turning it on without a
# blackrock.spike_file to sort is refused at load rather than silently skipped.
kilosort_on_blackrock: false

export_lfp: false      # LF-band copy, ~7 GB/hour at 385 channels -- see "LFP"
lfp_decimate: 1        # stride for it; 2 is safe, more aliases
export_figures: true   # per-unit and overview PNGs at export time

# ---------- edit for this session ----------
# Each system's own directory, written out in full: the raw recording and
# everything derived from it. Nothing is composed -- what is written here is what
# lands on disk. See "Paths" below.
blackrock_dir: "Z:/Monkey Athos/2026-08-13"
# The SpikeGLX probe folder itself, not the session folder: each system
# writes everything it produces to <dir>/kilosort4/, so the two systems
# must not share a directory. Loading raises if they do.
neuropixels_dir: "Z:/Monkey Athos/2026-08-13/Athos_2026_08_13_g0/Athos_2026_08_13_g0_imec0"

blackrock:
  # ---------- edit for this session ----------
  spike_file: null   # no Utah array in this session -- sync only
  sync_file: "{blackrock_dir}/NSP-Athos_001.ns5"    # the two sync channels
  probe_file: null       # ...so no channel map is needed, or looked for.
                         # An array's .cmp goes here too -- see "Probes".
  # ...and no kilosort: block either: those settings describe how to sort an
  # array that is not in this session.

  # ---------- defaults: change only if you know what they mean ----------
  sync_1hz_channel: 1    # NSP-*.ns5 channel carrying the 1 Hz square wave
  burst_channel: 2       # ...and the one carrying the 14 s coded burst
  sync_threshold: 2.5    # rising-edge thresholds, in volts after neo scaling
  burst_threshold: 2.5
  stream_id: null        # pin one when a .nsX exposes several streams
  gap_tolerance_ms: 10   # absorb PTP timestamp glitches -- see "The NSP clock"
  allow_segments: false  # a larger jump is a paused recording: stop, do not guess
  waveforms:             # the mean-waveform export -- see "Waveforms"
    window_ms: 2.0       # snippet width, centred on the spike sample
    max_spikes: 2000     # per unit, spread over the session; null = every spike
    filter_pad_ms: 10.0  # read either side and discard: no Kilosort filter transient
    export_snippets: false   # keep per-spike snippets: ~240 MB per million

neuropixels:
  # ---------- edit for this session ----------
  # The AP binary, named outright. CatGT still runs: its -dir/-run/-g/-t/-prb are
  # read back off this filename -- see "Where the SpikeGLX run went".
  bin_file: "{neuropixels_dir}/Athos_2026_08_13_g0_t0.imec0.ap.bin"
  lf_file: null          # only when the LF band is not beside the AP one
  preprocess:            # done before Kilosort, which then only whitens -- see "Preprocessing"
    method: catgt        # catgt | spikeinterface. CatGT that cannot run stops; it never switches
    highpass_hz: 300     # band-pass, Hz: CatGT -apfilter=butter,12,lo,hi
    lowpass_hz: 10000
    car_mode: gblcar     # gblcar (median) | gbldmx (demuxed mean, CatGT only) | null
    gfix: [0.40, 0.10, 0.02]   # CatGT transient removal: mV, mV/sample, mV; null = off
    phase_shift: true    # ADC multiplexing correction (CatGT tshift)
    motion: null         # a SpikeInterface correct_motion preset (dredge, ...); needs nblocks: 0
  kilosort:                    # every Kilosort parameter, stated -- see "Kilosort settings"
    # ---- this session ----
    bad_channels: []             # dead sites, as recording channel numbers -- see "Bad channels"
    nblocks: 1                   # rigid drift correction -- see "Drift correction"
    tmin: 0                      # sort from this second of the binary -- see "Sort window"
    tmax: .inf                   # ...to this one; .inf = the end of the file
    # ---- Kilosort's own values: change only if you know what they mean ----
    # Kilosort's own preprocessing, on every batch. Its CAR is always off:
    # that is preprocess.car_mode's job, done before Kilosort reads the file
    invert_sign: false           # flip the sign of the data before sorting
    highpass_cutoff: 300         # Hz, Fourier-domain highpass
    artifact_threshold: .inf     # zero any batch whose |value| exceeds this
    whitening_range: 32          # nearby channels used for local whitening
    nskip: 25                    # batch stride when estimating the whitening matrix
    shift: null                  # offset added to the raw data before anything else
    scale: null                  # ...then multiplied by this
    # batching
    batch_size: 60000            # samples per batch: 2 s at 30 kHz
    batch_downsampling: 1        # sort every n-th batch; 1 = all of them
    # drift estimation -- read only when nblocks > 0
    binning_depth: 5             # um, depth bin of the drift histogram
    sig_interp: 20               # um, width of the interpolation kernel
    drift_smoothing: [0.5, 0.5, 0.5]   # Gaussian sigma: correlation, time, depth
    # detection and templates
    Th_universal: 9              # detection threshold, universal templates
    Th_learned: 8                # detection threshold, learned templates
    Th_single_ch: 6              # single-channel threshold, in whitened SDs
    nt: 61                       # samples per waveform
    nt0min: null                 # trough sample within nt; null = int(20 * nt / 61)
    dmin: null                   # um, vertical template spacing; null = from the probe
    dminx: 32                    # um, horizontal template spacing
    min_template_size: 10        # um, smallest universal-template envelope
    template_sizes: 5            # how many envelope sizes
    nearest_chans: 10            # channels searched for a local maximum
    nearest_templates: 100       # template positions searched for a local maximum
    max_channel_distance: 32     # um, farthest a template may sit from its channel
    max_peels: 100               # matching-pursuit passes per batch
    templates_from_data: true    # learn the universal template shapes from the data
    n_templates: 6               # single-channel universal templates
    n_pcs: 6                     # single-channel PCs per spike
    # clustering
    acg_threshold: 0.2           # refractory violations allowed for a "good" label
    ccg_threshold: 0.25          # ...and for a split or merge
    cluster_neighbors: 10        # graph neighbours per spike
    cluster_downsampling: 20     # 1 spike in n is a landmark
    max_cluster_subset: 25000    # spikes searched for neighbours
    x_centers: null              # horizontal cluster centres; null = from the probe
    cluster_init_seed: 5         # k-means++ seed: same seed, same sort
    duplicate_spike_ms: 0.25     # a unit's repeats inside this are dropped; 0 keeps them
    position_limit: 100          # um, channels used to locate a spike
    # what is kept
    save_extra_vars: false       # also save per-spike features (large)
    clear_cache: false           # free GPU memory between steps: slower, smaller

  # ---------- defaults: change only if you know what they mean ----------
  probe_file: null       # the .meta beside bin_file wins -- see "Probes"
  n_chan_bin: null       # read from the .meta
  sync_bit: 6            # SY-word bit carrying the 1 Hz wave (SpikeGLX default)
  sync_pulse_ms: 500     # its high duration; a CatGT -xd argument
  burst_word: 1          # XA input on the OneBox carrying the 14 s burst
  burst_threshold_v: [1.0, 0.0]   # CatGT -xa volts (primary, secondary)
  burst_pulse_ms: 0      # expected burst width in ms; 0 accepts any
  waveforms:             # the mean-waveform export -- see "Waveforms"
    window_ms: 2.0       # snippet width, centred on the spike sample
    max_spikes: 2000     # per unit, spread over the session; null = every spike
    filter_pad_ms: 10.0  # read either side and discard: no Kilosort filter transient
    export_snippets: false   # keep per-spike snippets: ~240 MB per million

# The pulse train itself -- one signal, both systems see it. How each system
# *reads* it is wiring, and stays in that system's block above.
sync_period_s: 1.0
burst_interval_s: 14.0
alignment_tolerance_s: 0.001      # step 9 passes below this burst residual

# Kilosort settings shared by every stream. Empty on purpose: each system (and,
# with two probes, each probe) states its whole list above, and that list is
# merged over this one key by key -- so a key put here is overridden there and
# does nothing. See "Kilosort settings".
kilosort: {}


# ===========================================================================
# Notes -- why the values above are what they are.
# ===========================================================================
#
# Paths
#   Each system states its own directory outright, and {blackrock_dir} /
#   {neuropixels_dir} refer back to it -- that is how the raw files below are
#   named. Those two are the only placeholders a session file has; there is no
#   subject, date or machine root composed into a path, so what is written here
#   is what is opened.
#
#   The two are separate settings because the systems are recorded by different
#   machines and need not land on the same share. They must not be the same
#   directory: see the comment beside neuropixels_dir above.
#
#   A placeholder that names nothing raises on load rather than resolving to ""
#   -- so a typo, or a {monkey} left from an older config, fails immediately
#   instead of quietly producing "/Monkey Athos/...". A key that is not a
#   setting raises the same way, naming the closest real one.
#
# What runs
#   This file is where every "should it?" is written down, so a run is
#   `--config <this file>` and nothing else. The pipelines read these keys and
#   report the one that stopped a stage:
#
#     kilosort_on_<system>   false -> keep the recording, do not sort it
#     export_lfp             false -> no LF-band export (pipeline 2)
#     export_figures         false -> export the numbers, draw nothing
#
#   A few have a flag that overrides them for one run (--system on sorting;
#   --export-lfp, --export-waveforms on exporting). The flag never replaces the key: a
#   setting reachable only from a command line is one nobody can read back off
#   the session six months later.
#
# LFP
#   Off by default because at lfp_decimate: 1 it writes an output the size of the
#   recording -- about 7 GB per hour at 385 channels -- so it is a deliberate
#   request, made where the data lives. Blackrock LFPs are already saved
#   separately by Central, so this is Neuropixels only.
#
#   Decimation is a plain stride with no anti-alias filter. The LF band is
#   hardware-limited to ~500 Hz at 2500 Hz sampling, so 2 (-> 1250 Hz) is safe
#   and anything above it aliases.
#
# Which systems recorded
#   Derived from whether a block declares paths, not from a flag. To say a system
#   did not record, remove its block; there is then nothing to keep in step with
#   the paths beside it. Cross-system alignment (steps 8-9) runs when both blocks
#   are present.
#
#   Declaring paths means the data is *expected*, not that it is present: a share
#   that is not mounted still fails loudly with "does not exist" rather than being
#   read as "this system never recorded". The one question paths cannot answer is
#   whether to sort, which is what kilosort_on_* is for.
#
# Outputs -- one folder per system, beside its own recording
#   {blackrock_dir}/kilosort4/          sorted Utah array, NSP edge files,
#                                       the cross-system time map, and export/
#   {neuropixels_dir}/kilosort4/        sorted Neuropixels, SpikeGLX edge files,
#                                       the LF band, and export/
#
#   Everything derived from one recording lands in one directory, so handing an
#   analysis a sorting means handing it a folder rather than a tour of three
#   trees. There is no system or probe level above it: the directory this file
#   names already says which recording it is. Cross-system results go under the
#   Blackrock one, because Blackrock is the reference timebase.
#
# Where the SpikeGLX run went
#   A session names one binary -- bin_file -- and nothing else. There is no
#   run_dir/run_name/gate/trigger/probes, because everything they were for is
#   recoverable from the binary's own SpikeGLX filename:
#
#     <dir>/<run>_g<gate>/<run>_g<gate>_imec<probe>/<run>_g<gate>_t<trig>.imec<probe>.ap.bin
#
#   CatGT is still the preferred extractor and still runs first wherever the
#   machine has it: its -dir/-run/-g/-t/-prb come from that parse. So does the
#   OneBox .obx holding the 14 s burst, and the .lf.bin beside the AP file. A
#   binary NOT named that way -- a hand-cut extract, the Kilosort demo file --
#   simply has no run: CatGT is skipped with that reason in the report, the NumPy
#   detector stands alone, and lf_file must be named explicitly if you want one.
#
# Two probes
#   Two session files, each naming its own bin_file and its own neuropixels_dir.
#   They are separate streams with separate clocks, so each is sorted, extracted
#   and fitted onto Blackrock time entirely on its own -- which is exactly what
#   two files already express, with no probe dimension inside either one.
#
#   Point the two neuropixels_dir values at the two *_imec<n> folders and their
#   outputs cannot collide. Pointing both at a shared parent would put two
#   sortings in one kilosort4/, and _publish merges rather than clobbers, so the
#   result would be a blend of the two.
#
# Probes
#   Blackrock: probe_file, and that is the whole rule. It takes the array's own
#   .cmp wiring map, a .json built once by tools/make_probe.py, or an older
#   Kilosort .mat -- the extension picks the reader, so the format is a property
#   of the file rather than a second setting. (cmp_file used to be that second
#   setting, tried first; a session naming both said nothing about which won.)
#   With no probe_file, sorting REFUSES to start: a grid in channel order would
#   put units on the wrong electrodes, and its channel count would silently drop
#   every electrode past it. Which array is in which monkey is a property of the
#   session, which is why it is named here and not passed as a flag. If you truly
#   want a grid, build one -- make_probe.py utah with no --cmp -- and name it
#   here, so the choice is written down rather than assumed.
#
#   Neuropixels: the .meta beside bin_file wins wherever it has ~snsGeomMap,
#   because it records which sites were actually active for this recording --
#   something no external file can know. probe_file is the fallback for a binary
#   with no usable .meta; with neither, setup_probe raises rather than guess a
#   layout. Leave it null for NP 1.0 NHP long.
#
# The NSP clock
#   Blackrock timestamps everything -- .nev markers, eye traces, online spikes --
#   on the NSP's PTP clock, and the sorted spike times are put on that same axis
#   so they can be compared with any of it. Two facts make that non-obvious, and
#   both are measured from the recording's own per-sample timestamps rather than
#   assumed:
#
#     the origin   ~1.5e9 s, not zero
#     the rate     one measured .ns6 ran at 29999.865 Hz, not 30000 (-4.5 ppm),
#                  which is 51 ms of error by the end of a three-hour session
#
#   The fit and its residual are written to nsp_time_map.json beside the sorting
#   and beside the sync edges, and export_info.json records `timebase: "nsp"`.
#
#   gap_tolerance_ms exists because these files carry occasional corrupted packet
#   timestamps -- jumps of about a millisecond, sometimes negative, which cancel
#   within a few dozen samples -- and neo refuses to open the file at all without
#   a tolerance. Absorbing them loses no time. A jump *larger* than the tolerance
#   is a paused recording instead, and allow_segments decides whether sorting
#   across it is acceptable; false stops and prints the gap table.
#
# Waveforms and the .mat products
#   The LFP export and the waveform export are MATLAB v7.3 .mat files, one struct
#   each, opened by load() in MATLAB and by h5py or jlab_loader in Python. MATLAB
#   reverses dimensions, so data comes back as nChan x nSamples -- openNSx's
#   orientation, which the lab's loaders already assume.
#
#   The LFP is extracted with the rest of the extraction -- it needs only the
#   recording -- so it goes out on the probe's own clock. time_remapping then
#   stamps t0_blackrock/fs_blackrock into the same file, rewriting a handful of
#   small fields rather than the gigabytes of samples, so its samples end up on
#   the same axis as spike times and event markers. `timebase` says which one is
#   real: "stream" until the map is fitted, "blackrock" after.
#
#   Waveforms are cut through KILOSORT'S OWN READER, rebuilt from ops.npy on the
#   preprocessed binary it sorted (its highpass_cutoff and whitening -- then
#   undone), so the mean is cut from the signal Kilosort sorted, on either
#   system, and there is no separate filter to set here. Each
#   snippet is centred on its spike sample and scaled to microvolts by its
#   channel's gain (.ns6 header / .meta). Drift correction is not applied:
#   Kilosort does that only batch by batch while sorting. The export therefore
#   needs kilosort installed -- run it in the sorting env.
#
#   waveforms.export_snippets decides whether the per-spike snippets are KEPT,
#   not whether the recording is read: the mean waveform is measured either way,
#   so MeanWaveform always has a real amplitude. Snippets are single-precision
#   microvolts, ~240 MB per million spikes.
#
#   waveforms.max_spikes caps how many spikes each unit contributes, chosen
#   uniformly over the RECORDING rather than over the spike list: every k-th
#   spike would hand you a subset dominated by whichever task the unit fired
#   hardest in. The mean's error falls as 1/sqrt(n), so a couple of thousand
#   spikes is already past the point where more changes the answer, while the
#   reading is what costs. null measures every spike. Each measured spike is
#   exported with its spike_time_s and the timebase it is on, so a snippet can be
#   placed against the .nev markers and attributed to a task.
#
#   Everything derived from one sorted stream lands in one folder,
#   <system>/<stream>/kilosort4/export/: figures, the manifest, the LFP and the
#   three .mat products, so an analysis can be handed the directory whole.
#
# Bad channels
#   Kilosort removes the channels you list and has no detection of its own, so
#   look at the data and name them per array. Entries are recording channel
#   numbers -- rows in the binary, matched against the probe's chanMap -- not
#   positions on the array, and a number means a different site on each system.
#
#   Non-neural channels sharing a .ns6 (sync, analog in) need no entry: attaching
#   the probe drops whatever its chanMap does not cover.
#
# Drift correction
#   nblocks is how many depth blocks Kilosort tracks: 1 is rigid (the whole shank
#   moves together), 5 gives 5 non-overlapping blocks plus 4 straddling their
#   boundaries, 0 disables it.
#
#   It is off on the Utah array because the correction interpolates between
#   neighbouring contacts with a Gaussian kernel of sig_interp = 20 um. At 400 um
#   pitch the weight to the nearest neighbour is ~1e-87, so there is nothing to
#   interpolate from, and a nonzero shift estimate scales the data toward zero
#   rather than moving it -- the correction can only subtract signal here. Drift
#   on a chronic array is real; this is not the tool for it.
#
# Preprocessing
#   Done BEFORE Kilosort, which then only whitens (and re-applies its own
#   highpass_cutoff, harmlessly, on an already band-passed signal). This is the
#   workshop pipeline: CatGT -apfilter=butter,12,300,10000 -gblcar -gfix plus its
#   tshift, optionally DREDge, then Kilosort with do_CAR off.
#
#     method        catgt (Neuropixels only -- it reads SpikeGLX runs) or
#                   spikeinterface (both systems, and machines without CatGT).
#                   There is NO automatic fallback: CatGT that cannot run -- no
#                   catgt_dir on this machine, a binary not named the SpikeGLX
#                   way, CatGT failing -- stops with an error naming
#                   method: spikeinterface, so this file always says what ran.
#     car_mode      CatGT's names. gblcar subtracts the MEDIAN across channels
#                   (CatGT >= 3.6; SpikeInterface common_reference median).
#                   gbldmx subtracts the mean within each group of channels the
#                   probe digitises together -- CatGT only. null: no reference.
#                   Kilosort's do_CAR is always false; it is not a setting here.
#     gfix          CatGT finds fast, large transients (chewing, licking, cable
#                   knocks) -- amplitude above the first number in mV AND slope
#                   above the second in mV/sample -- and zeroes them until the
#                   signal falls back below the third (mV). CatGT only;
#                   SpikeInterface has no equivalent, so it must be null there.
#     phase_shift   Neuropixels digitises its channels in groups, a fraction of
#                   a sample apart; this re-aligns them (CatGT tshift, which is
#                   on unless -no_tshift). Needs the .meta.
#     motion        null keeps drift correction inside Kilosort (nblocks). A
#                   SpikeInterface correct_motion preset (dredge, ...) corrects it
#                   here instead and writes a motion-corrected binary; nblocks
#                   must then be 0, or drift is corrected twice -- refused at load.
#
#   The result is written to <system>_dir/preprocessed/ -- a .bin the size of
#   the recording, with preprocess.json beside it saying exactly what made it --
#   and that file, not the raw one, is what Kilosort sorts, Phy shows and the
#   waveform export reads. It is reused while preprocess.json still matches this
#   block and the source file; change either and the next sort makes it again.
#
#   Its samples start where the recording's do (CatGT may trim a ragged end, a
#   fraction of a second at most), so spike sample indices still line up with
#   the sync edges, and alignment is unchanged. With CatGT the same pass also
#   extracts those edges, so the AP binary is read once for both.
#
# Sort window
#   tmin/tmax are seconds from the start of the binary, and Kilosort sorts only
#   what lies between them. Spike times still count from the start of the FILE,
#   not from tmin, so nothing downstream shifts. Leave 0 / .inf for a whole-file
#   sort; narrow it to try settings on half an hour before committing to six.
#
# Kilosort settings
#   Every parameter Kilosort takes is written out in each kilosort: block, at the
#   value Kilosort itself would use, so a sort is fully described by this file
#   and changing one means editing the line that already states it. The values
#   are Kilosort 4's parameters.py and run_kilosort() defaults, except nblocks.
#
#   What Kilosort still does on every batch: subtract each channel's mean,
#   highpass at highpass_cutoff, whiten, and drift-correct at nblocks. Band-pass
#   and common reference are done before it -- see "Preprocessing".
#
#   Three layers, merged key by key: the top-level kilosort: block, then the
#   system's, then (with two probes) the probe's under by_probe:. A key at a lower
#   layer replaces the one above -- a list is overridden, not extended. Settings
#   that describe the hardware (nblocks, bad_channels) differ between systems;
#   the rest are stated identically in each block, and tests/test_config.py pins
#   that every block names the same keys, so none can go missing from one.
#
#   Not listed, on purpose:
#     n_chan_bin, fs, filename, probe, results_dir, data_dtype, device
#         set by the pipeline from the .meta / .ns6 / machine profile; naming one
#         here is refused with the setting that actually controls it
#     do_CAR
#         always false: the common reference is preprocess.car_mode's
#     save_preprocessed_copy
#         writes a whitened .dat the size of the recording, which is not copied
#         out of the cache, so it would be thrown away
#     progress_bar, verbose_console, verbose_log, torch_thread_lim, shank_idx
#         logging and resource knobs, not how the data is sorted
#
#   Each key goes to whichever of Kilosort's two places takes it -- the settings
#   dict or run_kilosort()'s arguments -- as the INSTALLED Kilosort says, and a
#   key it does not know is refused by name. So if the rig's Kilosort predates
#   one of these (cluster_init_seed, max_cluster_subset, batch_downsampling are
#   recent), the sort stops at once naming it: delete that line.
#   `run_sorting_pipeline.py --dry-run` makes the same check without a GPU.
