# One of the two example Neuropixels recordings in "practise spike sorting".
# Neuropixels only: no blackrock: block, so aligns_systems is false and the
# remapping stages skip themselves. Spike times stay in the sorter's own timebase
# and export_info.json records that.
#
#   python run_sorting_pipeline.py   --config configs/practise_20210819.yaml --dry-run
#   python run_sorting_pipeline.py   --config configs/practise_20210819.yaml
#   # curate in Phy, then
#   python run_exporting_pipeline.py --config configs/practise_20210819.yaml
#
# The sibling file, configs/practise_20210825.yaml, is this one with the other
# recording's name. They are two sessions, so they are two files -- see "Two
# recordings" at the end.

monkey: "practise"
session: "20210819"

kilosort_on_neuropixels: true
export_lfp: false
export_figures: true
export_groups: ["good", "mua"]

# Stated outright rather than composed from roots + monkey + session: this data
# predates that convention and sits in a plain folder. Points at the *_imec0
# directory, so everything derived from this recording lands beside it.
neuropixels_dir: "Z:/practise spike sorting/Tank_20210819_t1120_d9000_L12_map_g0/Tank_20210819_t1120_d9000_L12_map_g0_imec0"

neuropixels:
  # ---------- edit for this session ----------
  bin_file: "{neuropixels_dir}/Tank_20210819_t1120_d9000_L12_map_g0_t0.imec0.ap.bin"
  kilosort:
    bad_channels: []
    nblocks: 1           # rigid drift correction, as for any Neuropixels probe

  # ---------- defaults: change only if you know what they mean ----------
  lf_file: null          # found beside the AP binary when SpikeGLX wrote one
  probe_file: null       # the .meta beside bin_file wins
  n_chan_bin: null       # read from that .meta
  sync_bit: 6
  sync_pulse_ms: 500
  burst_word: 1
  burst_threshold_v: [1.0, 0.0]
  burst_pulse_ms: 0
  waveforms:
    window_ms: 2.0
    max_spikes: 2000
    highpass_hz: null    # the AP band is high-passed on the probe already
    highpass_order: 3
    filter_pad_ms: 10.0
    export_snippets: false

sync_period_s: 1.0
burst_interval_s: 14.0
alignment_tolerance_s: 0.001

kilosort: {}


# ===========================================================================
# Notes
# ===========================================================================
#
# Two recordings, two files
#   "practise spike sorting" holds two recordings -- Tank_20210819_..._map_g0 and
#   Tank_20210825_..._exp_g0 -- taken six days apart. They are two sessions, so
#   they get two config files, each with its own neuropixels_dir.
#
#   Do NOT point both at the shared parent folder. Output paths are built from
#   neuropixels_dir alone, with no run name and no session in them, so both would
#   resolve to the same kilosort4/ -- and _publish copies with dirs_exist_ok, so
#   the second sort would merge into the first rather than replace it, leaving one
#   directory holding a blend of two sortings.
#
# Where CatGT's arguments come from
#   Nothing here states run_dir, run_name, gate or trigger. All four are read back
#   off the bin_file name, which follows SpikeGLX's convention:
#
#     Tank_20210819_t1120_d9000_L12_map _g0 _t0 .imec0 .ap.bin
#     └────────────── run ────────────┘   g   t   probe
#
#   The run name here contains "_t1120", which is why the parse takes the *last*
#   _g<n>_t<n> before .imec rather than the first.
#
# What this session cannot do
#   With no Blackrock block there is no second clock, so time_remapping and
#   validate_remapping skip themselves and the exported spike times are on the
#   probe's own axis. That is the right answer for practice data; a real session
#   adds a blackrock: block with sync_file and gets the NSP timebase.
